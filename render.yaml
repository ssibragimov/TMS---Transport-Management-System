# Описание сервиса для Render (Blueprint). Подхватывается автоматически при
# подключении репозитория: Render → New → Blueprint.
#
# База данных здесь НЕ описана намеренно: используется внешний Neon, потому что
# бесплатный PostgreSQL на Render удаляется через месяц, а на Neon free-план
# бессрочный. DATABASE_URL и APP_DATABASE_URL задаются вручную в панели.
services:
  - type: web
    name: gsm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # Контекст — корень репозитория: сборке нужны package-lock.json и @gsm/shared.
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent

      # Владелец схемы — под ним идут миграции. Строка подключения Neon.
      - key: DATABASE_URL
        sync: false
      # Прикладная роль gsm_app — под ней работает рантайм и действует RLS.
      # Если не задать, RLS молча отключится и офисы перестанут быть изолированы.
      - key: APP_DATABASE_URL
        sync: false

      # В управляемом PostgreSQL нет TimescaleDB и PostGIS.
      - key: SKIP_SQL
        value: 03_telemetry.sql

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Домены, откуда браузеру разрешено обращаться к API. GitHub Pages пока
      # оставлен на время переезда фронтенда на gsm-web — уберём, когда
      # репозиторий станет приватным и Pages перестанет отдавать сайт.
      - key: API_CORS_ORIGINS
        value: https://ssibragimov.github.io,https://gsm-web-7vb2.onrender.com

      # Хранилище файлов не развёрнуто: конфигурация требует эти переменные при
      # старте, поэтому заданы заглушки. Загрузка сканов и фото работать не
      # будет — для этого нужен реальный S3-совместимый бакет.
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: S3_BUCKET
        value: gsm-files
      - key: S3_ACCESS_KEY
        value: unused
      - key: S3_SECRET_KEY
        value: unused

      # true заливает справочники, роли и администратора при каждом старте.
      # Нужно было только для самого первого запуска; в системе уже есть
      # реальные и демо-данные, поэтому здесь false — пробуждение контейнера
      # не должно их трогать.
      - key: SEED_ON_START
        value: 'false'
      # На управляемом бесплатном тарифе (512 МБ RAM) генератор демо-данных
      # (сотни путевых листов на 13 виртуальных офисов) не помещается в память
      # и роняет процесс — "JavaScript heap out of memory". Демо-данные нужны
      # только для локальной разработки, поэтому здесь они отключены.
      - key: SEED_DEMO_DATA
        value: 'false'
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false

  # Фронтенд — статический сайт. Раньше жил на GitHub Pages, но это требовало
  # публичного репозитория (бесплатный GitHub Pages не показывает сайт из
  # приватного репозитория). Здесь, на Render, приватность репозитория
  # ни на что не влияет — сервис исправно собирает и публикует его любым.
  - type: web
    name: gsm-web
    runtime: static
    buildCommand: npm ci && npm run build -w @gsm/shared && npm run build -w @gsm/web
    staticPublishPath: apps/web/dist
    envVars:
      # Собственного поддомена достаточно — в отличие от GitHub Pages,
      # здесь сайт живёт в корне, а не в подкаталоге /<репозиторий>/,
      # поэтому VITE_BASE не задаётся (по умолчанию '/').
      - key: VITE_API_URL
        value: https://gsm-api-337u.onrender.com/api
      # Ключ Яндекс.Карт: значение вводится один раз в панели Render, в
      # репозиторий не попадает. Без него карты показываются резервными
      # (схема / OpenStreetMap). В кабинете разработчика Яндекса для ключа
      # должен быть разрешён адрес этого сайта.
      - key: VITE_YANDEX_MAPS_API_KEY
        sync: false
    routes:
      # Без этого перезагрузка страницы на любом адресе, кроме главной
      # (например /drivers), отдавала бы 404: статический хостинг не знает
      # про клиентский роутинг React и ищет файл по этому пути буквально.
      - type: rewrite
        source: /*
        destination: /index.html
