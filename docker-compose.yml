name: gsm

services:
  # PostgreSQL 16 c PostGIS (геозоны) и TimescaleDB (телеметрия GPS).
  # Оба расширения понадобятся на этапе 8 — ставим сразу, чтобы не мигрировать БД потом.
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: gsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gsm}
      POSTGRES_USER: ${POSTGRES_USER:-gsm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_owner}
      # Прикладная роль — под ней работает API, на неё действует RLS.
      APP_DB_USER: ${APP_DB_USER:-gsm_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change_me_app}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gsm_owner} -d ${POSTGRES_DB:-gsm}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gsm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # Хранилище файлов: сканы страховок, техосмотров, накладных на ГСМ,
  # фото одометра из мобильного приложения водителя.
  minio:
    image: minio/minio:latest
    container_name: gsm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gsm_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me_minio}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Разовая инициализация бакета.
  minio-init:
    image: minio/mc:latest
    container_name: gsm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-gsm_minio} ${S3_SECRET_KEY:-change_me_minio};
      mc mb --ignore-existing local/${S3_BUCKET:-gsm-files};
      mc anonymous set none local/${S3_BUCKET:-gsm-files};
      echo 'MinIO bucket ready';
      "

  # Веб-клиент для БД. Убрать в проде.
  adminer:
    image: adminer:latest
    container_name: gsm-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
